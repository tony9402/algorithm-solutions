name: Solution Format

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "solutions/**"

permissions:
  contents: read

concurrency:
  group: solution-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  solution-format:
    name: solution-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Checkout trusted validator
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          path: trusted
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: trusted/requirements-pages.txt

      - name: Install validator dependencies
        run: python -m pip install -r trusted/requirements-pages.txt

      - name: Validate changed solution
        run: |
          python trusted/scripts/validate_solution_pr.py \
            --repo-root candidate \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.sha }}" \
            --result "$GITHUB_WORKSPACE/validation-result.json" \
            --comment "$GITHUB_WORKSPACE/validation-comment.md" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload validation result for PR comment
        if: always() && hashFiles('validation-result.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: solution-format-result
          path: |
            validation-result.json
            validation-comment.md
          if-no-files-found: error
          retention-days: 7
