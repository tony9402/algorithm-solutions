name: Solution Format PR Comment

on:
  workflow_run:
    workflows: [Solution Format]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: solution-format-comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download validation result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: solution-format-result
          path: validation-result
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create or update pull request comment
        uses: actions/github-script@v9
        env:
          COMMENT_PATH: ${{ github.workspace }}/validation-result/validation-comment.md
          RESULT_PATH: ${{ github.workspace }}/validation-result/validation-result.json
          PAYLOAD_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- solution-format-report -->";
            let report = {};
            if (fs.existsSync(process.env.RESULT_PATH)) {
              try {
                report = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, "utf8"));
              } catch (error) {
                core.warning(`검사 결과 JSON을 읽지 못했습니다: ${error.message}`);
              }
            }

            let pullNumber = Number(report.pr_number || process.env.PAYLOAD_PR_NUMBER);
            if (!Number.isInteger(pullNumber) || pullNumber < 1) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: process.env.RUN_HEAD_SHA,
              });
              const pullRequest = associated.data.find((item) => item.state === "open")
                || associated.data[0];
              pullNumber = pullRequest?.number;
            }
            if (!Number.isInteger(pullNumber) || pullNumber < 1) {
              core.setFailed("검사 결과를 연결할 pull request를 찾지 못했습니다.");
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (pullRequest.head.sha !== process.env.RUN_HEAD_SHA) {
              core.info("최신 커밋이 아닌 검사 결과이므로 댓글을 갱신하지 않습니다.");
              return;
            }

            let body;
            if (fs.existsSync(process.env.COMMENT_PATH)) {
              body = fs.readFileSync(process.env.COMMENT_PATH, "utf8");
            } else {
              const conclusion = process.env.RUN_CONCLUSION || "unknown";
              body = `${marker}\n## ⚠️ 솔루션 형식 검사 결과를 만들지 못했습니다.\n\n`
                + `검사 workflow가 \`${conclusion}\` 상태로 끝났지만 결과 파일이 없습니다. `
                + `[Actions 실행 보기](${process.env.RUN_URL})\n`;
            }
            if (!body.startsWith(marker)) body = `${marker}\n${body}`;
            if (body.length > 60000) {
              body = `${body.slice(0, 59500)}\n\n결과가 길어 일부를 생략했습니다. `
                + `[Actions 실행 보기](${process.env.RUN_URL})\n`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body,
              });
            }
