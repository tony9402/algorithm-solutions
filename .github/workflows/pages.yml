name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "announcements/**"
      - "community-data/**"
      - "community-worker/**"
      - "solutions/**"
      - "pages/**"
      - "scripts/solution_parser.py"
      - "scripts/sync_discussion_data.py"
      - "requirements-pages.txt"
      - "tests/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/sync_discussions.yml"
  pull_request:
    paths:
      - "announcements/**"
      - "community-data/**"
      - "community-worker/**"
      - "solutions/**"
      - "pages/**"
      - "scripts/solution_parser.py"
      - "scripts/sync_discussion_data.py"
      - "scripts/validate_solution_pr.py"
      - "requirements-pages.txt"
      - "tests/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/sync_discussions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: pages-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-pages.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Test community Worker
        run: node --test community-worker/test/worker.test.mjs

      - name: Build static site
        run: python pages/build.py
        env:
          COMMUNITY_VOTE_API_URL: ${{ vars.COMMUNITY_VOTE_API_URL }}

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: pages-deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
