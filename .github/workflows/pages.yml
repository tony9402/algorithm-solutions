name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "announcements/**"
      - "community-data/**"
      - "community-worker/**"
      - "solutions/**"
      - "pages/**"
      - "scripts/solution_parser.py"
      - "scripts/sync_discussion_data.py"
      - "requirements-pages.txt"
      - "tests/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/sync_discussions.yml"
  pull_request:
    paths:
      - "announcements/**"
      - "community-data/**"
      - "community-worker/**"
      - "solutions/**"
      - "pages/**"
      - "scripts/solution_parser.py"
      - "scripts/sync_discussion_data.py"
      - "scripts/validate_solution_pr.py"
      - "requirements-pages.txt"
      - "tests/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/sync_discussions.yml"
  workflow_run:
    workflows: ["Sync GitHub Discussions"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: pages-build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      build-id: ${{ steps.build-metadata.outputs.build-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-pages.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Test community Worker
        run: node --test community-worker/test/worker.test.mjs

      - name: Create build identifier
        id: build-metadata
        shell: bash
        run: echo "build-id=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build static site
        run: python pages/build.py
        env:
          COMMUNITY_VOTE_API_URL: ${{ vars.COMMUNITY_VOTE_API_URL }}
          SITE_BUILD_ID: ${{ steps.build-metadata.outputs.build-id }}

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: pages-deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public deployment revision
        shell: bash
        env:
          EXPECTED_BUILD_ID: ${{ needs.build.outputs.build-id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..60}; do
              html="$(curl --fail --silent --show-error \
                  --header "Cache-Control: no-cache" \
                  "$PAGE_URL")" || true
              marker="name=\"site-build-id\" content=\"${EXPECTED_BUILD_ID}\""
              if [[ "$html" == *"$marker"* ]]; then
                  echo "Public Pages revision verified: ${EXPECTED_BUILD_ID}"
                  exit 0
              fi
              echo "Waiting for GitHub Pages CDN propagation (${attempt}/60)"
              sleep 10
          done
          echo "GitHub Pages did not expose ${EXPECTED_BUILD_ID} within 10 minutes." >&2
          exit 1
