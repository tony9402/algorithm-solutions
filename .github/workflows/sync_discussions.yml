name: Sync GitHub Discussions

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: discussion-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: discussion-data-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test Discussion parser
        run: python -m unittest tests.test_sync_discussion_data -v

      - name: Sync Discussions to repository data
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/sync_discussion_data.py
          --repository "${{ github.repository }}"
          --comments-category "Announcements"
          --ratings-category "General"
          --output community-data/discussions.json

      - name: Check for updated data
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- community-data/discussions.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
          else
              echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synchronized data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- community-data/discussions.json
          git commit -m "chore: sync GitHub Discussion data"
          git push
